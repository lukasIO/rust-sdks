name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build artifacts but skip publishing/releasing."
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: write

jobs:
  # Tag the merged versions and create the GitHub releases (a draft for
  # livekit-ffi, which ffi-builds.yml fills and publishes). Nothing is
  # remembered between runs: a re-run finishes what is missing.
  release:
    # Only a release PR the tool opened: the branch prefix alone would let
    # any pushed `release/*` branch trigger a publish.
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/') && github.event.pull_request.user.login == 'github-actions[bot]' && contains(github.event.pull_request.body, '<!-- verwalter release -->'))
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.verwalter.outputs.released }}
      releases: ${{ steps.verwalter.outputs.releases }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The merge commit itself: a push to main right after the merge
          # must not move the tags.
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
      - id: verwalter
        uses: lukasIO/verwalter@v0.18.1
        with:
          command: release
          dry-run: ${{ inputs.dry_run || false }}

  # `verwalter publish` runs the workspace command from verwalter.toml
  # once (cargo-release walks the crates in order and skips published
  # versions), asks crates.io before and after, and reports per crate.
  # Only the crates this run released are in scope, from the release
  # step's output; a dispatched run with nothing new publishes nothing.
  publish-crates:
    needs: release
    if: needs.release.outputs.released == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0 # tags decide what is published
          submodules: recursive

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          rustflags: ""

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@75b4bfae1b2c753a6806bbce6e6cb89b602de33c # v1.22.0

      - name: Install cargo-release
        run: cargo binstall cargo-release@1.1.2 --no-confirm

      - name: Authenticate with crates.io
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish to crates.io
        uses: lukasIO/verwalter@v0.18.1
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        with:
          command: publish
          releases: ${{ needs.release.outputs.releases }}
          dry-run: ${{ inputs.dry_run || false }}

  call-node-ffi:
    name: Call Node FFI Builds
    needs: release
    if: contains(needs.release.outputs.releases, '"package":"livekit-ffi"') || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/node-builds.yml
    with:
      dry_run: ${{ inputs.dry_run || false }}
