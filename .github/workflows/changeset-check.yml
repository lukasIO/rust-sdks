name: Changeset Check

on:
  pull_request:
    types: [opened, synchronize, labeled, unlabeled]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  # Trusted publishing cannot create a new crate (see release.yml). This check
  # runs on the release PR, which is the last gate before publication.
  check-crates-published:
    name: Check crates exist on crates.io
    if: startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: .github/scripts/check_crates_published.sh

  check-changeset:
    name: Check for changeset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      # Fails when a crate changed without a changeset naming it, with a PR
      # comment that links to a prefilled changeset. Dependents are bumped
      # by the tool, so a changeset only names the crates whose own files
      # changed. The `internal` label exempts a PR.
      - uses: lukasIO/verwalter@v0.7.0
        with:
          command: check
